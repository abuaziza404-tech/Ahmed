name: Build BOUH MapScout V22.1 Zero Error APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-bouh-mapscout-v22-1.yml"

permissions:
  contents: read

concurrency:
  group: bouh-mapscout-v22-1-zero-error-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK From Root ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_MapScout_V22_1_ZERO_ERROR.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP exists
        run: |
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/mapscout/MainActivity.java
          test -f app/src/main/java/com/bouh/mapscout/RadarEngine.java
          test -f app/src/main/java/com/bouh/mapscout/WaypointDb.java
          test -f app/src/main/java/com/bouh/mapscout/TrackingService.java
          test -f app/src/main/assets/bouh_truth_rules.json
          echo "BOUH V22.1 project validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all 2>&1 | tee build-log.txt

      - name: Collect APK
        run: |
          mkdir -p "$OUTPUT_DIR"

          PROJECT_DIR="$PROJECT_DIR"
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            echo "Last build log lines:"
            tail -n 120 "$PROJECT_DIR/build-log.txt" || true
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH MapScout V22.1 Zero Error Build Report"
            echo "=========================================="
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-MapScout-V22-1-Zero-Error-APK
          path: |
            final-apk/BOUH_MapScout_V22_1_ZERO_ERROR.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-MapScout-V22-1-Failure-Diagnostics
          path: |
            BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR/build-log.txt
            BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR/app/build/reports/
            BOUH_MapScout_V22_1_ALL_IN_ONE_FIELD_RADAR_ZERO_ERROR/build/reports/
          if-no-files-found: ignore
          retention-days: 7
