name: Build BOUH MapScout V55.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_ANDROID_PROJECT.zip"
      - "BOUH_ANDROID_PROJECT_FIXED.zip"
      - "BOUH_V55_2_UPLOAD_ONLY_2_FILES.zip"
      - "BOUH_V55_2_UPLOAD_ONLY_2_FILES_FIXED.zip"
      - ".github/workflows/build.yml"
      - ".github/workflows/build_fixed.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK from compressed Android project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root files:"
          find . -maxdepth 2 -type f | sort | sed 's#^./##' | head -200

          PROJECT_ZIP=""

          if [ -f "BOUH_ANDROID_PROJECT_FIXED.zip" ]; then
            PROJECT_ZIP="BOUH_ANDROID_PROJECT_FIXED.zip"
          elif [ -f "BOUH_ANDROID_PROJECT.zip" ]; then
            PROJECT_ZIP="BOUH_ANDROID_PROJECT.zip"
          else
            OUTER_ZIP=""
            for z in *.zip; do
              [ -f "$z" ] || continue
              if unzip -l "$z" | grep -q "BOUH_ANDROID_PROJECT.zip"; then
                OUTER_ZIP="$z"
                break
              fi
            done

            if [ -z "$OUTER_ZIP" ]; then
              echo "ERROR: لم أجد BOUH_ANDROID_PROJECT.zip في الجذر، ولم أجد حزمة خارجية تحتوي عليه."
              echo "ارفع أحد هذه الملفات في جذر المستودع: BOUH_ANDROID_PROJECT.zip أو BOUH_V55_2_UPLOAD_ONLY_2_FILES.zip"
              exit 1
            fi

            echo "Found outer package: $OUTER_ZIP"
            unzip -o -j "$OUTER_ZIP" "BOUH_ANDROID_PROJECT.zip" -d .
            PROJECT_ZIP="BOUH_ANDROID_PROJECT.zip"
          fi

          echo "Using project zip: $PROJECT_ZIP"
          unzip -t "$PROJECT_ZIP"
          rm -rf build_project
          mkdir -p build_project
          unzip -q "$PROJECT_ZIP" -d build_project

          # If the zip contains one top-level folder, normalize it.
          if [ ! -f build_project/settings.gradle ] && [ ! -f build_project/settings.gradle.kts ]; then
            FIRST_DIR="$(find build_project -mindepth 1 -maxdepth 1 -type d | head -1 || true)"
            if [ -n "$FIRST_DIR" ] && { [ -f "$FIRST_DIR/settings.gradle" ] || [ -f "$FIRST_DIR/settings.gradle.kts" ]; }; then
              rm -rf build_project_normalized
              mv "$FIRST_DIR" build_project_normalized
              rm -rf build_project
              mv build_project_normalized build_project
            fi
          fi

          echo "Extracted Android project:"
          find build_project -maxdepth 5 -type f | sort | head -200

      - name: Validate project files
        shell: bash
        working-directory: build_project
        run: |
          set -euo pipefail
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/mapscout/MainActivity.java
          test -f app/src/main/assets/BOUH_V55_2_Pro_Field_Radar_App.html
          grep -q "BOUH V55.2" app/src/main/assets/BOUH_V55_2_Pro_Field_Radar_App.html

          # Some old validator copies expected the workflow file inside the Android project.
          # That is not required for Android build, so create a harmless placeholder if needed.
          mkdir -p .github/workflows
          if [ ! -f .github/workflows/build-android-apk.yml ]; then
            printf 'name: placeholder\n' > .github/workflows/build-android-apk.yml
          fi

          if [ -f validate_project.py ]; then
            python3 validate_project.py
          fi
          echo "Project validation OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build Debug APK
        shell: bash
        working-directory: build_project
        run: |
          set -euo pipefail
          ../gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f build_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V55_2_debug_apk
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V55_2_build_logs
          path: |
            build_project/app/build/reports/
            build_project/app/build/outputs/logs/
            build_project/build/reports/
          if-no-files-found: ignore
