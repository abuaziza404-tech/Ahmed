name: Build BOUH MapScout V55.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_ANDROID_PROJECT.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK from compressed Android project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f BOUH_ANDROID_PROJECT.zip
          unzip -t BOUH_ANDROID_PROJECT.zip
          rm -rf build_project
          mkdir -p build_project
          unzip -q BOUH_ANDROID_PROJECT.zip -d build_project
          echo "Extracted Android project:"
          find build_project -maxdepth 5 -type f | sort | head -120

      - name: Validate project files
        shell: bash
        working-directory: build_project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/mapscout/MainActivity.java
          test -f app/src/main/assets/BOUH_V55_2_Pro_Field_Radar_App.html
          grep -q "BOUH V55.2" app/src/main/assets/BOUH_V55_2_Pro_Field_Radar_App.html
          python3 validate_project.py
          echo "Project validation OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -L -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build Debug APK
        shell: bash
        working-directory: build_project
        run: |
          set -e
          ../gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f build_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V55_2_debug_apk
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V55_2_build_logs
          path: |
            build_project/app/build/reports/
            build_project/app/build/outputs/logs/
          if-no-files-found: ignore
