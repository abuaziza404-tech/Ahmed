name: Build Darbeel Night Vision Pro V3 Tactical

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "DarbeelNightVisionPro_V3_TACTICAL_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-darbeel-v3-root-zip.yml"

permissions:
  contents: read

concurrency:
  group: darbeel-v3-tactical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip Root Package And Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: DarbeelNightVisionPro_V3_TACTICAL_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: DarbeelNightVisionPro
      OUTPUT_DIR: final-apk
      APK_NAME: Darbeel_Night_Vision_Pro_V3_Tactical.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP
        run: |
          echo "Repository root:"
          ls -la

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            echo "ارفع ملف ZIP في جذر المستودع وليس داخل مجلد."
            exit 1
          fi

          echo "Root ZIP found:"
          ls -lh "$ZIP_NAME"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"

          echo "Files after unzip:"
          ls -la

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi

          echo "Project tree:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Missing settings.gradle/settings.gradle.kts"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "::error::Missing root build.gradle/build.gradle.kts"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Missing app/build.gradle/app/build.gradle.kts"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Missing AndroidManifest.xml"
            exit 1
          fi

          echo "Android project validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Show build tools versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p "$OUTPUT_DIR"

          echo "Searching APK files..."
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | sort || true

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"
          ls -lh "$OUTPUT_DIR/$APK_NAME"

      - name: Create build report
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIR"

          {
            echo "Darbeel Night Vision Pro V3 Tactical Build Report"
            echo "================================================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo ""
            echo "Root ZIP: $ZIP_NAME"
            echo "Project directory: $PROJECT_DIR"
            echo ""
            echo "APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" 2>/dev/null | sort || true
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darbeel-Night-Vision-Pro-V3-Tactical-APK
          path: |
            final-apk/Darbeel_Night_Vision_Pro_V3_Tactical.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Darbeel-V3-Build-Failure-Diagnostics
          path: |
            final-apk/
            DarbeelNightVisionPro/app/build/reports/
            DarbeelNightVisionPro/build/reports/
            DarbeelNightVisionPro/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
