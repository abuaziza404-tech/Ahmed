name: Build BOUH MapScout V20 Native OSM FieldCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_MapScout_V20_NATIVE_OSM_FIELDCORE_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-bouh-mapscout-v20.yml"

permissions:
  contents: read

concurrency:
  group: bouh-mapscout-v20-native-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK From Root ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: BOUH_MapScout_V20_NATIVE_OSM_FIELDCORE_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: BOUH_MapScout_V20_NATIVE_OSM_FIELDCORE
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_MapScout_V20_NATIVE_OSM_FIELDCORE.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP exists
        run: |
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/mapscout/MainActivity.java
          test -f app/src/main/assets/bouh_truth_rules.json
          echo "BOUH V20 Native OSM project validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p "$OUTPUT_DIR"
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH MapScout V20 Native OSM FieldCore Build Report"
            echo "=================================================="
            echo "Features:"
            echo "- Native osmdroid MapView"
            echo "- Real pinch zoom"
            echo "- Fast pan"
            echo "- Tile cache"
            echo "- Esri Satellite HD"
            echo "- OSM Roads"
            echo "- OpenTopo"
            echo "- Custom XYZ cloud layer"
            echo "- Clarity / Sharpness / Contrast controls"
            echo "- BOUH decision gates"
            echo "- CSV/KML export"
            echo ""
            echo "Truth rule:"
            echo "Map tiles are visual/navigation aids only. GeoTIFF/RAW bands/DEM required for numeric spectral analysis."
            echo ""
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-MapScout-V20-Native-OSM-APK
          path: |
            final-apk/BOUH_MapScout_V20_NATIVE_OSM_FIELDCORE.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30
