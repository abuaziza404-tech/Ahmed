name: Build BOUH MapScout V55.2 APK - ZIP Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
      - ".github/workflows/build-bouh-v55-2-no-manual-unzip.yml"

permissions:
  contents: read

jobs:
  build-android-from-uploaded-zip:
    name: Build Android APK from ZIP payload
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded ZIP exists
        run: |
          set -e
          echo "Checking payload ZIP..."
          test -f "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
          ls -lh "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
          unzip -t "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"

      - name: Extract ZIP inside GitHub Actions
        run: |
          set -e
          rm -rf build_payload
          mkdir -p build_payload
          unzip -q "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip" -d build_payload
          echo "Extracted payload:"
          find build_payload -maxdepth 4 -type f | sort | head -80

      - name: Validate payload structure
        run: |
          set -e
          python3 build_payload/validate_payload.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        run: |
          set -e
          curl -L -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build debug APK
        working-directory: build_payload
        run: |
          set -e
          ../gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: List APK output
        run: |
          set -e
          find build_payload/app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V55_2_debug_apk
          path: build_payload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V55_2_build_logs
          path: |
            build_payload/app/build/reports/
            build_payload/app/build/outputs/logs/
          if-no-files-found: ignore
