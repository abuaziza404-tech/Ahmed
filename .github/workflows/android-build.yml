name: BOUH Assistant Pro Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build BOUH Assistant Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository root:"
          ls -la
          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradlew" \) -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew not found in repository root"
            exit 1
          fi

      - name: Validate Android project structure
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle or build.gradle.kts not found"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app module folder not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

          echo "Android project structure OK"

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon clean :app:assembleDebug --stacktrace

      - name: Build Release APK unsigned
        run: |
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Collect APK files
        if: always()
        run: |
          mkdir -p build_outputs
          find . -type f -name "*.apk" -print -exec cp {} build_outputs/ \;
          echo "Collected APK files:"
          ls -lah build_outputs || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Assistant-Pro-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Assistant-Pro-Release-Unsigned-APK
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload All APK Outputs
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Assistant-Pro-All-APK-Outputs
          path: build_outputs/*.apk
          if-no-files-found: warn
