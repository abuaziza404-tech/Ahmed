name: Build BOUH Darbeel V8 Photon-Telescope APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "DarbeelNightVisionPro_V8_PHOTON_TELESCOPE_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-darbeel-v8-photon-telescope.yml"

permissions:
  contents: read

concurrency:
  group: bouh-darbeel-v8-photon-telescope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK With Python OpenCV Vision Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: DarbeelNightVisionPro_V8_PHOTON_TELESCOPE_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: DarbeelNightVisionPro
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_Darbeel_V8_Photon_Telescope.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP exists
        run: |
          echo "Repository root:"
          ls -la

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            echo "ارفع ملف ZIP في جذر المستودع وليس داخل مجلد."
            exit 1
          fi

          echo "Root ZIP found:"
          ls -lh "$ZIP_NAME"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Validate Android and Python project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/generate_luts.py
          test -f tools/validate_vision_engine.py
          test -f requirements.txt
          echo "BOUH V8 project validation passed."

      - name: Set up Python vision stack
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DarbeelNightVisionPro/requirements.txt

      - name: Install Python specialized libraries
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Photon-Telescope LUTs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python tools/generate_luts.py
          test -f app/src/main/assets/bouh_v8_photon_luts.json

      - name: Run OpenCV detail-recovery validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python tools/validate_vision_engine.py
          test -f build/vision-test/v8_detail_recovery.png
          test -f build/vision-test/vision_score.txt
          cat build/vision-test/vision_score.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK and reports
        run: |
          mkdir -p "$OUTPUT_DIR"

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH Darbeel V8 Photon-Telescope Build Report"
            echo "============================================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo ""
            echo "Root ZIP: $ZIP_NAME"
            echo "Python/OpenCV validation: enabled"
            echo "Photon LUT: app/src/main/assets/bouh_v8_photon_luts.json"
            echo ""
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
            echo ""
            echo "Vision score:"
            cat "$PROJECT_DIR/build/vision-test/vision_score.txt" || true
          } > "$OUTPUT_DIR/build-report.txt"

          cp -r "$PROJECT_DIR/build/vision-test" "$OUTPUT_DIR/vision-test" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Darbeel-V8-Photon-Telescope-APK
          path: |
            final-apk/BOUH_Darbeel_V8_Photon_Telescope.apk
            final-apk/build-report.txt
            final-apk/vision-test/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Darbeel-V8-Failure-Diagnostics
          path: |
            final-apk/
            DarbeelNightVisionPro/build/vision-test/
            DarbeelNightVisionPro/app/build/reports/
            DarbeelNightVisionPro/build/reports/
            DarbeelNightVisionPro/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
