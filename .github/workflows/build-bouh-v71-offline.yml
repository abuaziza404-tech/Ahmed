name: BOUH V71 Offline Layers APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'BOUH_V71_GITHUB_ACTIONS_UPLOAD_PACKAGE.zip'
      - '.github/workflows/build-bouh-v71-offline.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate upload package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="BOUH_V71_GITHUB_ACTIONS_UPLOAD_PACKAGE.zip"
          if [ ! -f "$PACKAGE" ]; then
            PACKAGE="$(ls -1 *GITHUB_ACTIONS_UPLOAD_PACKAGE*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${PACKAGE:-}" ] || [ ! -f "$PACKAGE" ]; then
            echo "ERROR: Upload BOUH_V71_GITHUB_ACTIONS_UPLOAD_PACKAGE.zip to the repository root." >&2
            exit 1
          fi
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "Using package: $PACKAGE"

      - name: Unpack package inside runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bouh_pkg"
          unzip -q "$PACKAGE" -d "$RUNNER_TEMP/bouh_pkg"
          ROOT="$(find "$RUNNER_TEMP/bouh_pkg" -maxdepth 2 -type d -name inputs | head -n 1 | xargs dirname)"
          if [ -z "${ROOT:-}" ] || [ ! -d "$ROOT/inputs" ]; then
            echo "ERROR: Package structure is invalid. Expected inputs/ and scripts/." >&2
            find "$RUNNER_TEMP/bouh_pkg" -maxdepth 3 -type f | sed -n '1,80p'
            exit 1
          fi
          echo "PKG_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Package root: $ROOT"

      - name: Patch V71 APK with offline Sentinel layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports build/unsigned
          python3 "$PKG_ROOT/scripts/patch_bouh_v71_offline_layers.py" \
            --input-dir "$PKG_ROOT/inputs" \
            --out build/unsigned/BOUH-TERRAIN-RADAR-V71-offline-layers-unsigned.apk \
            --report build/reports/BOUH_V71_OFFLINE_LAYER_PATCH_REPORT.md

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Zipalign and sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/output
          zipalign -p -f 4 \
            build/unsigned/BOUH-TERRAIN-RADAR-V71-offline-layers-unsigned.apk \
            build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-aligned.apk

          keytool -genkeypair -v \
            -keystore build/bouh-v71-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BOUH V71 Debug,O=BOUH,C=SD"

          apksigner sign \
            --ks build/bouh-v71-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-github-signed.apk \
            build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-aligned.apk

          apksigner verify --verbose --print-certs \
            build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-github-signed.apk

          sha256sum build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-github-signed.apk | tee build/output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-V71-offline-layers-github-signed-apk
          path: |
            build/output/BOUH-TERRAIN-RADAR-V71-offline-layers-github-signed.apk
            build/output/SHA256SUMS.txt
            build/reports/BOUH_V71_OFFLINE_LAYER_PATCH_REPORT.md
          if-no-files-found: error
