name: BOUH V66 One-File Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Generate Project And Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
          cache-provider: basic

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Generate full BOUH Android project from this single YML
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app build.gradle.kts settings.gradle.kts README.md

          mkdir -p app/src/main/java/com/bouh/one
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BOUH_V66_ONE_FILE_ANDROID"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.bouh.one"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.bouh.one"
                  minSdk = 23
                  targetSdk = 37
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101820</item>
                  <item name="android:navigationBarColor">#101820</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="BOUH V66"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bouh/one/MainActivity.java <<'EOF'
          package com.bouh.one;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private final String[] modules = new String[] {
                      "1. حفظ وتصدير واستيراد الملفات والصور",
                      "2. مساعد AI محلي عربي قابل للتطوير",
                      "3. خرائط GPS وملاحة للطرق الوعرة",
                      "4. رادار استشعار الجبال والأرض API + GPS",
                      "5. طبيب تشخيص عام بحذر طبي",
                      "6. نموذج شاعر نبطي عربي"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(16, 24, 32));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 34, 28, 34);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("BOUH V66\nمساعد منظومة أبوعزيزه");
                  title.setTextColor(Color.rgb(245, 214, 139));
                  title.setTextSize(26);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("\nنسخة ملف واحد: YML ينشئ المشروع كاملًا ويبني APK داخل GitHub Actions.\nهذه نواة تشغيل مستقرة للتطوير الاحترافي.");
                  subtitle.setTextColor(Color.WHITE);
                  subtitle.setTextSize(15);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle);

                  addSection(root, "الأقسام الداخلية");

                  for (String module : modules) {
                      Button button = new Button(this);
                      button.setText(module);
                      button.setAllCaps(false);
                      button.setTextSize(15);
                      button.setOnClickListener(v ->
                              Toast.makeText(this, "سيتم تطوير هذا القسم في المرحلة التالية", Toast.LENGTH_SHORT).show()
                      );
                      root.addView(button);
                  }

                  addSection(root, "نواة BOUH الجيولوجية");

                  TextView core = new TextView(this);
                  core.setText(
                          "Structure → Pattern → Alteration → Confirmation → Decision\n\n" +
                          "لا تقييم على FeOx وحده.\n" +
                          "لا هدف بلا بنية + طين/سيليكا داعمة.\n" +
                          "GPZ 7000: ضبط الأرض حسب الخطر المغناطيسي والكوارتز.\n" +
                          "الحفر تثبت النموذج، لكنها لا تكون هدف البحث."
                  );
                  core.setTextColor(Color.rgb(220, 235, 230));
                  core.setTextSize(15);
                  core.setPadding(0, 10, 0, 20);
                  root.addView(core);

                  TextView footer = new TextView(this);
                  footer.setText("Developed for Ahmed Abu Aziza Al-Rashidi");
                  footer.setTextColor(Color.rgb(160, 170, 170));
                  footer.setTextSize(13);
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0, 30, 0, 10);
                  root.addView(footer);

                  setContentView(scroll);
              }

              private void addSection(LinearLayout root, String text) {
                  TextView section = new TextView(this);
                  section.setText("\n" + text);
                  section.setTextColor(Color.rgb(245, 214, 139));
                  section.setTextSize(19);
                  section.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(section);
              }
          }
          EOF

          cat > README.md <<'EOF'
          # BOUH V66 One-File Android Builder

          هذا المستودع يمكن أن يحتوي فقط على ملف GitHub Actions واحد.

          الملف:
          .github/workflows/android-build.yml

          عند تشغيله يقوم بإنشاء مشروع Android كامل داخل Runner ثم يبني APK.
          EOF

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V66_ONE_FILE_DEBUG_APK
          path: app/build/outputs/apk/debug/*.apk
