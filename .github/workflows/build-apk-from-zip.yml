name: Build BOUH Terrain Radar APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Extract source ZIP and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Locate and extract BOUH source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BOUH_TERRAIN_RADAR_ANDROID_GITHUB_ACTIONS_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload BOUH_TERRAIN_RADAR_ANDROID_GITHUB_ACTIONS_READY.zip beside this workflow."
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf _bouh_build
          mkdir -p _bouh_build
          unzip -q "$ZIP_FILE" -d _bouh_build

          if [ -d "_bouh_build/BOUH_ANDROID_GITHUB_READY" ]; then
            echo "PROJECT_DIR=_bouh_build/BOUH_ANDROID_GITHUB_READY" >> "$GITHUB_ENV"
          elif [ -f "_bouh_build/settings.gradle" ]; then
            echo "PROJECT_DIR=_bouh_build" >> "$GITHUB_ENV"
          elif [ -f "_bouh_build/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=_bouh_build" >> "$GITHUB_ENV"
          else
            FOUND_DIR="$(find _bouh_build -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
            if [ -n "$FOUND_DIR" ]; then
              echo "PROJECT_DIR=$FOUND_DIR" >> "$GITHUB_ENV"
            else
              echo "ERROR: Could not find Gradle Android project after extraction."
              find _bouh_build -maxdepth 4 -type f | head -120
              exit 1
            fi
          fi

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Missing settings.gradle or settings.gradle.kts"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Missing root build.gradle or build.gradle.kts"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Missing app/build.gradle or app/build.gradle.kts"
            exit 1
          fi

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Patch MainActivity Java error
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(find "$PROJECT_DIR/app/src/main/java" -name 'MainActivity.java' -print -quit || true)"

          if [ -z "$MAIN" ]; then
            echo "No Java MainActivity found. Skipping Java patch."
            exit 0
          fi

          echo "Patching: $MAIN"

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          main_files = list((project / "app/src/main/java").rglob("MainActivity.java"))

          if not main_files:
              raise SystemExit(0)

          p = main_files[0]
          s = p.read_text(encoding="utf-8")

          old_title = "req.setTitle(URLUtil.guessFileName(url, contentDisposition, mimetype));"
          new_title = "String fileName = URLUtil.guessFileName(url, contentDisposition, mimetype);\n                    req.setTitle(fileName);"

          if old_title in s and "String fileName = URLUtil.guessFileName" not in s:
              s = s.replace(old_title, new_title)

          s = s.replace(
              "req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, req.getTitle().toString());",
              "req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);"
          )

          if "req.getTitle()" in s:
              raise SystemExit("ERROR: req.getTitle() still exists after patch")

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-RADAR-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
