name: Build Android APK From Root ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BOUH_MapScout_V23_SAFE_BUILD_FIELDCORE_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-bouh-mapscout-v23.yml"

permissions:
  contents: read

concurrency:
  group: bouh-mapscout-v23-safe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK From Root ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: BOUH_MapScout_V23_SAFE_BUILD_FIELDCORE_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: BOUH_MapScout_V23_SAFE_BUILD_FIELDCORE
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_MapScout_V23_SAFE_BUILD_FIELDCORE.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP exists
        shell: bash
        run: |
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            exit 1
          fi
          ls -lh "$ZIP_NAME"

      - name: Install unzip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/mapscout/MainActivity.java
          test -f app/src/main/java/com/bouh/mapscout/OverzoomTileSources.java
          test -f app/src/main/java/com/bouh/mapscout/BouhLocationFilter.java
          test -f app/src/main/java/com/bouh/mapscout/RadarEngine.java
          test -f app/src/main/java/com/bouh/mapscout/WaypointDb.java
          test -f app/src/main/assets/bouh_truth_rules.json
          echo "BOUH V23 Safe Build validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH MapScout V23 Safe Build FieldCore Build Report"
            echo "=================================================="
            echo "ZIP: $ZIP_NAME"
            echo "Project: $PROJECT_DIR"
            echo ""
            echo "Features:"
            echo "- Native osmdroid MapView"
            echo "- Infinite Overzoom Z24"
            echo "- Native max Z17 clamp"
            echo "- GPS jitter filter 2m"
            echo "- Floating toolbar"
            echo "- Pin Drop"
            echo "- Radar proxy"
            echo "- Dynamic GPR/Paleo/Drainage bars"
            echo "- Fe/Q/P modes"
            echo "- SQLite waypoints"
            echo "- KML/CSV export"
            echo ""
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-MapScout-V23-Safe-Build-APK
          path: |
            final-apk/BOUH_MapScout_V23_SAFE_BUILD_FIELDCORE.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30
