name: Build BOUH Terrain Radar APK V72 Offline Layers

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Extract source ZIP and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Locate and extract BOUH source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="BOUH_TERRAIN_RADAR_ANDROID_GITHUB_ACTIONS_READY_V72_OFFLINE_LAYERS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root." >&2
            echo "Upload the ZIP file to the root of the repository." >&2
            find . -maxdepth 2 -type f -name '*.zip' -print >&2 || true
            exit 1
          fi

          rm -rf _bouh_build
          mkdir -p _bouh_build
          unzip -q "$ZIP_FILE" -d _bouh_build

          if [ -d "_bouh_build/BOUH_ANDROID_GITHUB_READY_V72" ]; then
            echo "PROJECT_DIR=_bouh_build/BOUH_ANDROID_GITHUB_READY_V72" >> "$GITHUB_ENV"
          elif [ -f "_bouh_build/settings.gradle" ]; then
            echo "PROJECT_DIR=_bouh_build" >> "$GITHUB_ENV"
          else
            echo "ERROR: Could not find Gradle Android project after extraction." >&2
            find _bouh_build -maxdepth 4 -type f | head -120 >&2
            exit 1
          fi

      - name: Validate project before build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/offline_layers/sentinel_20260329/True_color.png"
          test -f "$PROJECT_DIR/app/src/main/assets/offline_layers/sentinel_20260329/Highlight_Optimized_Natural_Color.png"
          test -f "$PROJECT_DIR/app/src/main/assets/offline_layers/sentinel_20260329/NDSI.png"
          test -f "$PROJECT_DIR/app/src/main/java/com/bouh/terrainradar/MainActivity.java"
          grep -q "com.android.application" "$PROJECT_DIR/build.gradle"
          grep -q "namespace 'com.bouh.terrainradar'" "$PROJECT_DIR/app/build.gradle"
          grep -q "MainActivity" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q "sentinel_true" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "Sentinel-2 لون حقيقي Offline" "$PROJECT_DIR/app/src/main/assets/index.html"

          if grep -R "req.getTitle()" "$PROJECT_DIR/app/src/main/java"; then
            echo "ERROR: stale MainActivity bug found: req.getTitle()" >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-RADAR-V72-OFFLINE-LAYERS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
