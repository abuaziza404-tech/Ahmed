name: Build BOUH MapScout V48 ZIP Payload

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "BOUH_MapScout_V48_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
      - ".github/workflows/build-uploaded-bouh-v48-zip.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify payload ZIP
        run: |
          test -f "BOUH_MapScout_V48_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
          unzip -t "BOUH_MapScout_V48_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"

      - name: Extract payload
        run: |
          rm -rf build_payload
          mkdir -p build_payload
          unzip -q "BOUH_MapScout_V48_ANDROID_PAYLOAD_UPLOAD_ONLY.zip" -d build_payload
          python3 build_payload/validate_payload.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        run: |
          curl -L -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Gradle sanity check
        working-directory: build_payload
        run: ../gradle-8.7/bin/gradle projects --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: build_payload
        run: ../gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f build_payload/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V48_debug_apk
          path: build_payload/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload QA assets
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V48_QA_assets
          path: |
            build_payload/app/src/main/assets/BOUH_V48_PACKAGED_V47_QA_REPORT.json
            build_payload/app/src/main/assets/BOUH_V47_top1000_radar_test.csv
