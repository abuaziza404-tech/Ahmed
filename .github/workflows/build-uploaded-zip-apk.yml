name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build-uploaded-zip-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP recursively
        run: |
          rm -rf source
          mkdir source

          echo "Extracting main ZIP..."
          unzip -q "$ZIP_FILE" -d source

          echo "Checking for nested project ZIP..."
          NESTED_ZIP=$(find source -type f -name "*.zip" | head -1)

          if [ -n "$NESTED_ZIP" ]; then
            echo "Nested ZIP found: $NESTED_ZIP"
            rm -rf source_nested
            mkdir source_nested
            unzip -q "$NESTED_ZIP" -d source_nested
            rm -rf source
            mv source_nested source
          fi

          echo "Extracted files:"
          find source -maxdepth 5 -type f | head -150

      - name: Detect Android project root
        run: |
          PROJECT_DIR=""

          FOUND=$(find source -maxdepth 8 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts inside ZIP."
            echo "The ZIP does not contain an Android Gradle project."
            echo "Files found:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Collect APK files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -name "*.apk" -print -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          ls -lah "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuAzizaAI-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
