name: Build BOUH Universal APK From Root ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build-bouh-universal.yml"

permissions:
  contents: read

concurrency:
  group: bouh-universal-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Detect ZIP And Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_Latest_Build.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find root ZIP package
        id: find_zip
        shell: bash
        run: |
          echo "Repository root:"
          ls -la

          ZIP_NAME="$(find . -maxdepth 1 -type f -name "*.zip" | sed 's#^\./##' | sort | tail -n 1)"

          if [ -z "$ZIP_NAME" ]; then
            echo "::error::No ZIP file found in repository root."
            echo "ارفع ملف ZIP في جذر المستودع."
            exit 1
          fi

          echo "Detected ZIP: $ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip package
        shell: bash
        run: |
          ZIP_NAME="${{ steps.find_zip.outputs.zip_name }}"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_NAME" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Detect Android project directory
        id: detect_project
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Could not detect Android project directory."
            echo "الملف ZIP يجب أن يحتوي مشروع Android وفيه settings.gradle أو settings.gradle.kts."
            exit 1
          fi

          echo "Detected project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Android project
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"

          PROJECT_DIR="${{ steps.detect_project.outputs.project_dir }}"
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH Universal Build Report"
            echo "=========================="
            echo "ZIP: ${{ steps.find_zip.outputs.zip_name }}"
            echo "Project: $PROJECT_DIR"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Latest-APK
          path: |
            final-apk/BOUH_Latest_Build.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Universal-Build-Failure
          path: |
            final-apk/
            extracted/**/build/reports/
            extracted/**/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
