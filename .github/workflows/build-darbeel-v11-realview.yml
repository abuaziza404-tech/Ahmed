name: Build BOUH Darbeel V11 RealView APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "DarbeelNightVisionPro_V11_REALVIEW_ROOT_ZIP_ONLY.zip"
      - ".github/workflows/build-darbeel-v11-realview.yml"

permissions:
  contents: read

concurrency:
  group: bouh-darbeel-v11-realview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK From Root ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: DarbeelNightVisionPro_V11_REALVIEW_ROOT_ZIP_ONLY.zip
      PROJECT_DIR: DarbeelNightVisionPro
      OUTPUT_DIR: final-apk
      APK_NAME: BOUH_Darbeel_V11_RealView.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root ZIP exists
        run: |
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Missing $ZIP_NAME in repository root."
            echo "ارفع ملف ZIP في جذر المستودع وليس داخل مجلد."
            exit 1
          fi
          ls -lh "$ZIP_NAME"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source package
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Expected folder $PROJECT_DIR was not found after unzip."
            exit 1
          fi
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/darbeel/MainActivity.java
          echo "BOUH V11 RealView project validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p "$OUTPUT_DIR"

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/$APK_NAME"

          {
            echo "BOUH Darbeel V11 RealView Build Report"
            echo "====================================="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo ""
            echo "Fix: Real TextureView camera preview + optional processed BOOST overlay"
            echo "APK:"
            ls -lh "$OUTPUT_DIR/$APK_NAME"
          } > "$OUTPUT_DIR/build-report.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Darbeel-V11-RealView-APK
          path: |
            final-apk/BOUH_Darbeel_V11_RealView.apk
            final-apk/build-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Darbeel-V11-Failure-Diagnostics
          path: |
            final-apk/
            DarbeelNightVisionPro/app/build/reports/
            DarbeelNightVisionPro/build/reports/
            DarbeelNightVisionPro/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
