name: Build Abuaziza AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  APP_ID: com.abuaziza.ai
  APP_NAME: Abuaziza AI
  APP_VERSION: "1.0.4"
  APP_VERSION_CODE: "4"

  AGP_VERSION: "9.4.0"
  GRADLE_VERSION: "9.6.0"
  JDK_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  CI_KEYSTORE_PASSWORD: "AbuazizaCI2026"
  CI_KEY_PASSWORD: "AbuazizaCI2026"
  CI_KEY_ALIAS: "abuaziza-ci"

jobs:
  build:
    name: Build signed Abuaziza AI APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1) Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2) Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3) Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK configured."
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" || true

      # ---------------------------------------------------------
      # 4) Generate a completely clean Android project
      # ---------------------------------------------------------
      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf gradle
          rm -f \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            local.properties \
            gradlew \
            gradlew.bat

          mkdir -p app/src/main/java/com/abuaziza/ai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbuazizaAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.builtInKotlin=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.abuaziza.ai"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.abuaziza.ai"
                  minSdk = 23
                  targetSdk = 36

                  versionCode = 4
                  versionName = "1.0.4"
              }

              signingConfigs {
                  create("ciRelease") {
                      storeFile = file(
                          System.getenv("CI_KEYSTORE_FILE")
                              ?: rootProject.file("ci-release.jks")
                      )

                      storePassword =
                          System.getenv("CI_KEYSTORE_PASSWORD")
                              ?: "AbuazizaCI2026"

                      keyAlias =
                          System.getenv("CI_KEY_ALIAS")
                              ?: "abuaziza-ci"

                      keyPassword =
                          System.getenv("CI_KEY_PASSWORD")
                              ?: "AbuazizaCI2026"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      applicationIdSuffix = ".debug"
                  }

                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("ciRelease")
                  }
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              lint {
                  abortOnError = true
                  checkReleaseBuilds = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="أبوعزيزة AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Abuaziza">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أبوعزيزة AI</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="abuaziza_bg">#121212</color>
              <color name="abuaziza_surface">#1B1B1B</color>
              <color name="abuaziza_gold">#D4AF37</color>
              <color name="abuaziza_text">#FFFFFF</color>
              <color name="abuaziza_muted">#B8B8B8</color>
              <color name="abuaziza_input">#202020</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.Abuaziza"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/abuaziza_bg</item>
                  <item name="android:navigationBarColor">@color/abuaziza_bg</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/bg_input.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/abuaziza_input" />
              <corners android:radius="28dp" />
              <stroke
                  android:width="1dp"
                  android:color="@color/abuaziza_gold" />
              <padding
                  android:left="16dp"
                  android:top="8dp"
                  android:right="16dp"
                  android:bottom="8dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_card.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/abuaziza_surface" />
              <corners android:radius="22dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_gold_button.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/abuaziza_gold" />
              <corners android:radius="22dp" />
          </shape>
          EOF

      # ---------------------------------------------------------
      # 5) Generate functional Arabic UI
      # ---------------------------------------------------------
      - name: Generate Abuaziza AI interface
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/abuaziza/ai/MainActivity.kt <<'EOF'
          package com.abuaziza.ai

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var messagesContainer: LinearLayout
              private lateinit var input: EditText

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              private fun addMessage(
                  text: String,
                  fromUser: Boolean = false
              ) {
                  val box = TextView(this).apply {
                      this.text = text
                      this.textSize = 16f
                      this.setTextColor(
                          Color.WHITE
                      )
                      this.setPadding(
                          dp(16),
                          dp(12),
                          dp(16),
                          dp(12)
                      )
                      this.textDirection =
                          if (fromUser) {
                              TextView.TEXT_DIRECTION_ANY_RTL
                          } else {
                              TextView.TEXT_DIRECTION_ANY_RTL
                          }
                      this.background = getDrawable(
                          if (fromUser) {
                              R.drawable.bg_gold_button
                          } else {
                              R.drawable.bg_card
                          }
                      )

                      if (fromUser) {
                          setTextColor(Color.BLACK)
                      }

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  dp(8),
                                  dp(6),
                                  dp(8),
                                  dp(6)
                              )
                          }
                  }

                  messagesContainer.addView(box)

                  val scroll =
                      messagesContainer.parent.parent as ScrollView

                  scroll.post {
                      scroll.fullScroll(ScrollView.FOCUS_DOWN)
                  }
              }

              private fun generateLocalReply(
                  prompt: String
              ): String {
                  val p = prompt.trim()

                  if (p.isEmpty()) {
                      return "اكتب طلبك أولاً."
                  }

                  return when {
                      p.contains("قصيدة") ||
                      p.contains("شعر") ->
                          "أستطيع مساعدتك في صياغة قصيدة نبطية، ضبط القافية، وتحليل الوزن."

                      p.contains("كود") ||
                      p.contains("برمج") ->
                          "أرسل الكود أو الخطأ وسأحلله معك خطوة بخطوة."

                      p.contains("فكرة") ||
                      p.contains("مشروع") ->
                          "أرسل المجال والهدف، وسأحوّل الفكرة إلى خطة تنفيذ واضحة."

                      p.contains("حلل") ||
                      p.contains("تحليل") ->
                          "تم استلام طلب التحليل. أرسل النص أو البيانات كاملة لأعطيك تحليلاً منظماً."

                      else ->
                          "تم استلام طلبك: $p\n\nهذه نسخة محلية تجريبية من الواجهة. ربط نموذج ذكاء اصطناعي فعلي يحتاج إلى Backend/API آمن."
                  }
              }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(
                          Color.rgb(18, 18, 18)
                      )
                      layoutDirection =
                          LinearLayout.LAYOUT_DIRECTION_RTL
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(
                          dp(16),
                          dp(14),
                          dp(16),
                          dp(14)
                      )
                      setBackgroundColor(
                          Color.rgb(25, 25, 25)
                      )
                  }

                  val title = TextView(this).apply {
                      text = "أبوعزيزة AI"
                      textSize = 22f
                      setTextColor(
                          Color.rgb(212, 175, 55)
                      )
                      gravity = Gravity.CENTER
                  }

                  header.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  val newChat = Button(this).apply {
                      text = "محادثة جديدة"
                      setOnClickListener {
                          messagesContainer.removeAllViews()
                          addMessage(
                              "مرحباً بك في أبوعزيزة AI.\nكيف أساعدك اليوم؟"
                          )
                      }
                  }

                  header.addView(
                      newChat,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      header,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                  }

                  messagesContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(8),
                          dp(12),
                          dp(8),
                          dp(12)
                      )
                  }

                  scroll.addView(
                      messagesContainer,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  val quickScroll =
                      HorizontalScrollView(this).apply {
                          isHorizontalScrollBarEnabled = false
                      }

                  val quickBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4)
                      )
                  }

                  val quickActions = listOf(
                      "اكتب لي",
                      "حلّل",
                      "قصيدة",
                      "كود",
                      "أفكار"
                  )

                  quickActions.forEach { label ->
                      val button = Button(this).apply {
                          text = label
                          setOnClickListener {
                              input.setText(label)
                              input.requestFocus()
                          }
                      }

                      quickBar.addView(
                          button,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  dp(4),
                                  dp(2),
                                  dp(4),
                                  dp(2)
                              )
                          }
                      )
                  }

                  quickScroll.addView(quickBar)

                  root.addView(
                      quickScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val composer =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.HORIZONTAL
                          gravity =
                              Gravity.CENTER_VERTICAL
                          setPadding(
                              dp(8),
                              dp(8),
                              dp(8),
                              dp(12)
                          )
                      }

                  input = EditText(this).apply {
                      hint = "اكتب رسالتك..."
                      hintTextColor =
                          Color.rgb(150, 150, 150)
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      gravity =
                          Gravity.CENTER_VERTICAL or
                          Gravity.RIGHT
                      background =
                          getDrawable(
                              R.drawable.bg_input
                          )
                      setSingleLine(false)
                      maxLines = 4
                  }

                  composer.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          dp(58),
                          1f
                      ).apply {
                          setMargins(
                              0,
                              0,
                              dp(8),
                              0
                          )
                      }
                  )

                  val send = Button(this).apply {
                      text = "إرسال"
                      setOnClickListener {
                          val prompt =
                              input.text.toString()

                          if (prompt.trim().isNotEmpty()) {
                              addMessage(
                                  prompt,
                                  true
                              )

                              input.setText("")

                              addMessage(
                                  generateLocalReply(
                                      prompt
                                  )
                              )
                          }
                      }
                  }

                  composer.addView(
                      send,
                      LinearLayout.LayoutParams(
                          dp(90),
                          dp(58)
                      )
                  )

                  root.addView(
                      composer,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)

                  addMessage(
                      "مرحباً بك في أبوعزيزة AI.\nكيف أساعدك اليوم؟"
                  )
              }
          }
          EOF

      # ---------------------------------------------------------
      # 6) Validate project structure
      # ---------------------------------------------------------
      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail

          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/abuaziza/ai/MainActivity.kt

          if grep -R 'org.jetbrains.kotlin.android' -n . \
            --exclude-dir=.git \
            --exclude='*.md'; then
            echo "ERROR: Legacy Kotlin Android plugin detected."
            exit 1
          fi

          if grep -R 'kotlinOptions\|JvmTarget\|kotlin {' -n app \
            --exclude='*.md'; then
            echo "ERROR: Legacy Kotlin configuration detected."
            exit 1
          fi

          echo "Project validation passed."

      # ---------------------------------------------------------
      # 7) Temporary CI signing key
      # ---------------------------------------------------------
      - name: Generate CI signing key
        shell: bash
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/abuaziza-ci-release.jks
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE_FILE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Abuaziza AI, OU=CI, O=Abuaziza, C=SD"

          test -s "$CI_KEYSTORE_FILE"

          echo "CI signing key generated."

      # ---------------------------------------------------------
      # 8) Install Gradle 9.6
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      # ---------------------------------------------------------
      # 9) Generate Gradle wrapper
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 10) Smoke test = compile Debug APK
      # ---------------------------------------------------------
      - name: Compile debug APK - smoke test
        shell: bash
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/abuaziza-ci-release.jks
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          test -s \
            "app/build/outputs/apk/debug/app-debug.apk"

          echo "Debug APK compilation passed."

      # ---------------------------------------------------------
      # 11) Android Lint
      # ---------------------------------------------------------
      - name: Run Android lint
        shell: bash
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/abuaziza-ci-release.jks
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:lint \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "Android lint passed."

      # ---------------------------------------------------------
      # 12) Build signed Release APK
      # ---------------------------------------------------------
      - name: Build signed release APK
        shell: bash
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/abuaziza-ci-release.jks
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          test -s \
            "app/build/outputs/apk/release/app-release.apk"

          echo "Release APK built successfully."

      # ---------------------------------------------------------
      # 13) Verify APK
      # ---------------------------------------------------------
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            "$APK"

          mkdir -p release

          cp "$APK" \
            "release/abuaziza-ai-v${APP_VERSION}.apk"

          sha256sum \
            "release/abuaziza-ai-v${APP_VERSION}.apk" \
            | tee "release/abuaziza-ai-v${APP_VERSION}.sha256"

          ls -lh release/

          echo "APK verification passed."

      # ---------------------------------------------------------
      # 14) Build summary
      # ---------------------------------------------------------
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Abuaziza AI Build"
            echo
            echo "- App: ${APP_NAME}"
            echo "- Application ID: ${APP_ID}"
            echo "- Version: ${APP_VERSION}"
            echo "- Version Code: ${APP_VERSION_CODE}"
            echo "- AGP: ${AGP_VERSION}"
            echo "- Gradle: ${GRADLE_VERSION}"
            echo "- JDK: ${JDK_VERSION}"
            echo "- Android API: ${ANDROID_API}"
            echo "- Build Tools: ${BUILD_TOOLS}"
            echo

            if [ -f "release/abuaziza-ai-v${APP_VERSION}.apk" ]; then
              echo "### APK"
              echo
              echo "Release APK generated successfully."
              echo

              ls -lh \
                "release/abuaziza-ai-v${APP_VERSION}.apk"

              echo
              echo "### SHA-256"
              cat \
                "release/abuaziza-ai-v${APP_VERSION}.sha256"
            else
              echo "Release APK was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # 15) Upload artifact
      # ---------------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-v${{ env.APP_VERSION }}
          path: |
            release/abuaziza-ai-v${{ env.APP_VERSION }}.apk
            release/abuaziza-ai-v${{ env.APP_VERSION }}.sha256
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 16) Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${APP_VERSION}-${GITHUB_RUN_NUMBER}"
          APK="release/abuaziza-ai-v${APP_VERSION}.apk"
          SHA="release/abuaziza-ai-v${APP_VERSION}.sha256"

          gh release create "$TAG" \
            "$APK" \
            "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Abuaziza AI ${APP_VERSION}" \
            --notes "Automated Android release build for Abuaziza AI ${APP_VERSION}." \
            --target "$GITHUB_SHA"

          echo "GitHub Release created: $TAG"
