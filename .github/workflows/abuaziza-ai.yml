name: Abuaziza AI - Build Release

on:
  workflow_dispatch:

  push:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          ! grep -RniE 'sk-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}' . --exclude-dir=.git \
            || (echo "Possible API key detected"; exit 1)

          ! grep -RniE 'Runtime\.getRuntime|ProcessBuilder|cleartextTrafficPermitted="true"' app \
            || (echo "Unsafe execution/network pattern detected"; exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 37 / build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          test -n "$APK"
          test -s "$APK"

          sha256sum "$APK" | tee apk.sha256

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-release
          path: |
            ${{ env.APK }}
            apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: abuaziza-v1.0.${{ github.run_number }}
          name: Abuaziza AI v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ env.APK }}
            apk.sha256
