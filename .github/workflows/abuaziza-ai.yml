name: Build Abuaziza AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  APP_ID: com.abuaziza.ai
  APP_NAME: Abuaziza AI
  VERSION_NAME: 1.0.3
  VERSION_CODE: 4

  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  AGP_VERSION: "9.4.0"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:

  build:

    name: Build Abuaziza AI APK

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. VERIFY PREINSTALLED ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android here.
      # Ubuntu 24.04 GitHub Runner already contains Android SDK.
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Android SDK directory:"
          ls -la "$ANDROID_HOME"

          echo "Finding sdkmanager..."

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Android SDK verification passed."


      # ==========================================================
      # 4. INSTALL / VERIFY REQUIRED SDK COMPONENTS
      # ==========================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed || true


      # ==========================================================
      # 5. CLEAN OLD GENERATED PROJECT
      # ==========================================================

      - name: Clean old generated project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf gradle
          rm -rf build
          rm -rf .gradle
          rm -rf release

          rm -f settings.gradle
          rm -f settings.gradle.kts

          rm -f build.gradle
          rm -f build.gradle.kts

          rm -f gradle.properties

          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/abuaziza/ai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/abuaziza/ai
          mkdir -p release


      # ==========================================================
      # 6. SETTINGS
      # ==========================================================

      - name: Generate settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbuazizaAI"

          include(":app")
          EOF


      # ==========================================================
      # 7. ROOT BUILD
      # ==========================================================

      - name: Generate root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
          }
          EOF


      # ==========================================================
      # 8. GRADLE PROPERTIES
      # ==========================================================

      - name: Generate gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=false

          android.useAndroidX=true
          android.nonTransitiveRClass=true

          android.builtInKotlin=true
          EOF


      # ==========================================================
      # 9. ANDROID MANIFEST
      # ==========================================================

      - name: Generate AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Abuaziza AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================================
      # 10. STYLE
      # ==========================================================

      - name: Generate styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #121212
                  </item>

                  <item name="android:navigationBarColor">
                      #121212
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 11. APP BUILD GRADLE
      #
      # NO org.jetbrains.kotlin.android
      #
      # AGP 9.4 has built-in Kotlin support.
      # ==========================================================

      - name: Generate app build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {

              namespace = "com.abuaziza.ai"

              compileSdk = 36

              defaultConfig {

                  applicationId = "com.abuaziza.ai"

                  minSdk = 26

                  targetSdk = 36

                  versionCode = 4

                  versionName = "1.0.3"

                  testInstrumentationRunner =
                      "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {

                  release {

                      isMinifyEnabled = false

                      isShrinkResources = false
                  }

                  debug {

                      isMinifyEnabled = false
                  }
              }

              compileOptions {

                  sourceCompatibility = JavaVersion.VERSION_17

                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {

                  abortOnError = true
              }
          }

          dependencies {

              implementation(
                  "androidx.core:core-ktx:1.17.0"
              )

              implementation(
                  "androidx.appcompat:appcompat:1.7.1"
              )

              testImplementation(
                  "junit:junit:4.13.2"
              )
          }
          EOF


      # ==========================================================
      # 12. MAIN ACTIVITY
      # ==========================================================

      - name: Generate MainActivity.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/abuaziza/ai/MainActivity.kt <<'EOF'
          package com.abuaziza.ai

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  val root =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              40,
                              40,
                              40,
                              40
                          )

                          setBackgroundColor(
                              Color.rgb(
                                  18,
                                  18,
                                  18
                              )
                          )
                      }

                  val title =
                      TextView(this).apply {

                          text = "أبوعزيزة AI"

                          textSize = 32f

                          setTextColor(
                              Color.rgb(
                                  212,
                                  175,
                                  55
                              )
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  val subtitle =
                      TextView(this).apply {

                          text =
                              "منصة الذكاء الاصطناعي"

                          textSize = 18f

                          setTextColor(
                              Color.WHITE
                          )

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              0,
                              24,
                              0,
                              0
                          )
                      }

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }
          }
          EOF


      # ==========================================================
      # 13. TEST
      # ==========================================================

      - name: Generate unit test
        shell: bash
        run: |
          cat > app/src/test/java/com/abuaziza/ai/BasicTest.kt <<'EOF'
          package com.abuaziza.ai

          import org.junit.Test
          import org.junit.Assert.assertTrue

          class BasicTest {

              @Test
              fun projectBuildTest() {

                  assertTrue(true)
              }
          }
          EOF


      # ==========================================================
      # 14. VALIDATE PROJECT
      # ==========================================================

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/abuaziza/ai/MainActivity.kt

          if grep -R \
            "org.jetbrains.kotlin.android" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.gradle; then

            echo "ERROR:"
            echo "Legacy Kotlin Android plugin detected."

            exit 1
          fi

          echo "Project validation passed."


      # ==========================================================
      # 15. GRADLE
      # ==========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: true


      # ==========================================================
      # 16. GENERATE WRAPPER
      # ==========================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin

          chmod +x gradlew

          test -f gradlew

          test -f \
            gradle/wrapper/gradle-wrapper.properties


      # ==========================================================
      # 17. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

          ./gradlew help \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 18. VERIFY ANDROID TASKS
      # ==========================================================

      - name: Verify Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --all \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 19. UNIT TEST
      # ==========================================================

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 20. LINT
      # ==========================================================

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:lint \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 21. BUILD APK
      # ==========================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 22. CHECK APK
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            app/build/outputs/apk/release/app-release-unsigned.apk


      # ==========================================================
      # 23. COPY APK
      # ==========================================================

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          test -f \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          ls -lh release/


      # ==========================================================
      # 24. SHA256
      # ==========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
            | tee \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256"


      # ==========================================================
      # 25. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-v${{ env.VERSION_NAME }}

          path: |
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk.sha256

          if-no-files-found: error


      # ==========================================================
      # 26. GITHUB RELEASE
      # ==========================================================

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists: $TAG"

            gh release upload \
              "$TAG" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256" \
              --clobber

          else

            gh release create \
              "$TAG" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256" \
              --title "Abuaziza AI ${VERSION_NAME}" \
              --notes "Automated Android release build."

          fi


      # ==========================================================
      # 27. FINAL SUMMARY
      # ==========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "       ABUAZIZA AI BUILD SUMMARY"
          echo "=========================================="

          echo "Application: ${APP_NAME}"
          echo "Package:     ${APP_ID}"
          echo "Version:     ${VERSION_NAME}"
          echo "Code:        ${VERSION_CODE}"

          echo "Java:        ${JAVA_VERSION}"
          echo "Gradle:      ${GRADLE_VERSION}"
          echo "AGP:         ${AGP_VERSION}"

          echo "Android API: ${ANDROID_API}"
          echo "BuildTools:  ${BUILD_TOOLS}"

          echo "=========================================="

          if [ -f \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"
          ]; then

            echo "APK CREATED"

            ls -lh \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          else

            echo "APK NOT CREATED"

          fi

          echo "=========================================="
