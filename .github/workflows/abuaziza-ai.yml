name: Abuaziza AI - Production Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: abuaziza-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  AGP_VERSION: "9.4.0"
  APP_ID: "com.abuaziza.ai"
  APP_VERSION_NAME: "1.0.4"
  APP_VERSION_CODE: "5"

jobs:
  build:
    name: Build Abuaziza AI APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"


      # =========================================================
      # CREATE CLEAN ANDROID PROJECT
      # =========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app gradle .ci release

          rm -f \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat

          mkdir -p \
            app/src/main/java/com/abuaziza/ai \
            app/src/main/res/values \
            app/src/test/java/com/abuaziza/ai \
            .ci \
            release


          # =====================================================
          # SETTINGS
          # =====================================================

          cat > settings.gradle.kts <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbuazizaAI"

          include(":app")
          KOTLIN


          # =====================================================
          # ROOT BUILD
          # =====================================================

          cat > build.gradle.kts <<'KOTLIN'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          KOTLIN


          # =====================================================
          # GRADLE PROPERTIES
          # =====================================================

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=false

          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.builtInKotlin=true
          PROPS


          # =====================================================
          # APP BUILD
          # =====================================================

          cat > app/build.gradle.kts <<'KOTLIN'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.abuaziza.ai"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.abuaziza.ai"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 5
                  versionName = "1.0.4"
              }

              signingConfigs {
                  create("ciRelease") {
                      storeFile = rootProject.file(
                          ".ci/abuaziza-release.jks"
                      )

                      storePassword =
                          System.getenv("CI_STORE_PASSWORD") ?: ""

                      keyAlias =
                          System.getenv("CI_KEY_ALIAS") ?: "abuaziza"

                      keyPassword =
                          System.getenv("CI_KEY_PASSWORD") ?: ""
                  }
              }

              buildTypes {

                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false

                      signingConfig =
                          signingConfigs.getByName("ciRelease")
                  }

                  getByName("debug") {
                      applicationIdSuffix = ".debug"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  abortOnError = true
                  checkReleaseBuilds = true
              }

              packaging {
                  resources {
                      excludes +=
                          "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation(
                  "androidx.core:core-ktx:1.17.0"
              )

              implementation(
                  "androidx.appcompat:appcompat:1.7.1"
              )

              testImplementation(
                  "junit:junit:4.13.2"
              )
          }
          KOTLIN


          # =====================================================
          # PROGUARD
          # =====================================================

          cat > app/proguard-rules.pro <<'PROGUARD'
          # Abuaziza AI release rules.
          PROGUARD


          # =====================================================
          # MANIFEST
          # =====================================================

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="أبوعزيزة AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          XML


          # =====================================================
          # COLORS
          # =====================================================

          cat > app/src/main/res/values/colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="abu_black">
                  #121212
              </color>

              <color name="abu_gold">
                  #D4AF37
              </color>

              <color name="abu_white">
                  #FFFFFF
              </color>

              <color name="abu_gray">
                  #B9B9B9
              </color>

          </resources>
          XML


          # =====================================================
          # STYLE
          # =====================================================

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      @color/abu_black
                  </item>

                  <item name="android:navigationBarColor">
                      @color/abu_black
                  </item>

                  <item name="android:colorAccent">
                      @color/abu_gold
                  </item>

              </style>

          </resources>
          XML


          # =====================================================
          # MAIN ACTIVITY
          # =====================================================

          cat > app/src/main/java/com/abuaziza/ai/MainActivity.kt <<'KOTLIN'
          package com.abuaziza.ai

          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var messages: LinearLayout
              private lateinit var chatScroll: ScrollView
              private lateinit var input: EditText

              private val black =
                  Color.rgb(18, 18, 18)

              private val surface =
                  Color.rgb(27, 27, 27)

              private val surface2 =
                  Color.rgb(38, 38, 38)

              private val gold =
                  Color.rgb(212, 175, 55)

              private val white =
                  Color.WHITE

              private val gray =
                  Color.rgb(185, 185, 185)


              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = black
                  window.navigationBarColor = black

                  buildUi()
              }


              private fun buildUi() {

                  val root =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          setBackgroundColor(black)

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL
                      }


                  root.addView(
                      createHeader(),

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(78)
                      )
                  )


                  chatScroll =
                      ScrollView(this).apply {

                          isFillViewport = true

                          setBackgroundColor(black)
                      }


                  messages =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          setPadding(
                              dp(18),
                              dp(18),
                              dp(18),
                              dp(18)
                          )

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL
                      }


                  chatScroll.addView(
                      messages,

                      ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  root.addView(
                      chatScroll,

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )


                  showWelcome()


                  root.addView(
                      createQuickActions(),

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(58)
                      )
                  )


                  root.addView(
                      createInputBar(),

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  setContentView(root)
              }


              private fun createHeader():
                  LinearLayout {

                  val header =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(18),
                              dp(10),
                              dp(18),
                              dp(10)
                          )

                          setBackgroundColor(surface)

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL
                      }


                  val logo =
                      TextView(this).apply {

                          text = "أ"

                          textSize = 22f

                          gravity = Gravity.CENTER

                          setTextColor(black)

                          background =
                              roundedBackground(
                                  gold,
                                  22
                              )
                      }


                  header.addView(
                      logo,

                      LinearLayout.LayoutParams(
                          dp(50),
                          dp(50)
                      ).apply {

                          leftMargin = dp(8)

                          rightMargin = dp(8)
                      }
                  )


                  val titleBox =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.CENTER_VERTICAL
                      }


                  val title =
                      TextView(this).apply {

                          text = "أبوعزيزة AI"

                          textSize = 20f

                          setTextColor(white)

                          gravity = Gravity.RIGHT
                      }


                  val status =
                      TextView(this).apply {

                          text = "مساعدك الذكي"

                          textSize = 12f

                          setTextColor(gray)

                          gravity = Gravity.RIGHT
                      }


                  titleBox.addView(title)

                  titleBox.addView(status)


                  header.addView(
                      titleBox,

                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )


                  val newButton =
                      Button(this).apply {

                          text = "جديد"

                          textSize = 13f

                          setTextColor(gold)

                          isAllCaps = false

                          background =
                              roundedBackground(
                                  surface2,
                                  18
                              )


                          setOnClickListener {

                              messages.removeAllViews()

                              showWelcome()

                              input.setText("")


                              Toast.makeText(
                                  this@MainActivity,
                                  "بدأت محادثة جديدة",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }


                  header.addView(
                      newButton,

                      LinearLayout.LayoutParams(
                          dp(74),
                          dp(50)
                      )
                  )


                  return header
              }


              private fun createQuickActions():
                  HorizontalScrollView {

                  val scroll =
                      HorizontalScrollView(this).apply {

                          isHorizontalScrollBarEnabled =
                              false

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL

                          setBackgroundColor(black)
                      }


                  val row =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(12),
                              dp(5),
                              dp(12),
                              dp(5)
                          )

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL
                      }


                  addQuickButton(
                      row,
                      "اكتب لي",
                      "اكتب لي نصًا احترافيًا عن "
                  )


                  addQuickButton(
                      row,
                      "حلّل",
                      "حلّل هذا النص: "
                  )


                  addQuickButton(
                      row,
                      "قصيدة",
                      "ساعدني في كتابة قصيدة عن "
                  )


                  addQuickButton(
                      row,
                      "كود",
                      "اكتب لي كودًا لحل "
                  )


                  addQuickButton(
                      row,
                      "أفكار",
                      "أعطني أفكار مشاريع في "
                  )


                  scroll.addView(row)

                  return scroll
              }


              private fun addQuickButton(
                  row: LinearLayout,
                  label: String,
                  prompt: String
              ) {

                  val button =
                      Button(this).apply {

                          text = label

                          textSize = 12f

                          setTextColor(gold)

                          isAllCaps = false

                          background =
                              roundedBackground(
                                  surface2,
                                  20
                              )


                          setOnClickListener {

                              input.setText(prompt)

                              input.setSelection(
                                  input.text.length
                              )

                              input.requestFocus()
                          }
                      }


                  row.addView(
                      button,

                      LinearLayout.LayoutParams(
                          dp(92),
                          dp(44)
                      ).apply {

                          leftMargin = dp(5)

                          rightMargin = dp(5)
                      }
                  )
              }


              private fun createInputBar():
                  LinearLayout {

                  val area =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(12),
                              dp(10),
                              dp(12),
                              dp(14)
                          )

                          setBackgroundColor(surface)

                          layoutDirection =
                              View.LAYOUT_DIRECTION_RTL
                      }


                  input =
                      EditText(this).apply {

                          hint =
                              "اكتب رسالتك هنا..."

                          setHintTextColor(
                              Color.rgb(
                                  125,
                                  125,
                                  125
                              )
                          )

                          setTextColor(white)

                          textSize = 16f

                          gravity =
                              Gravity.RIGHT or
                              Gravity.CENTER_VERTICAL

                          inputType =
                              InputType.TYPE_CLASS_TEXT or
                              InputType.TYPE_TEXT_FLAG_MULTI_LINE

                          maxLines = 4

                          minLines = 1

                          setPadding(
                              dp(18),
                              dp(8),
                              dp(18),
                              dp(8)
                          )

                          background =
                              roundedBackground(
                                  surface2,
                                  28
                              )
                      }


                  area.addView(
                      input,

                      LinearLayout.LayoutParams(
                          0,
                          dp(56),
                          1f
                      )
                  )


                  val send =
                      Button(this).apply {

                          text = "إرسال"

                          textSize = 13f

                          setTextColor(black)

                          isAllCaps = false

                          background =
                              roundedBackground(
                                  gold,
                                  28
                              )


                          setOnClickListener {
                              sendMessage()
                          }
                      }


                  area.addView(
                      send,

                      LinearLayout.LayoutParams(
                          dp(82),
                          dp(56)
                      ).apply {

                          leftMargin = dp(8)
                      }
                  )


                  return area
              }


              private fun showWelcome() {

                  addCenteredText(
                      "مرحبًا بك في أبوعزيزة AI",
                      28f,
                      gold,
                      12
                  )


                  addCenteredText(
                      "مساحة عمل عربية للكتابة والتحليل والأفكار والبرمجة",
                      15f,
                      gray,
                      22
                  )


                  val status =
                      TextView(this).apply {

                          text =
                              "● النظام المحلي جاهز"

                          textSize = 13f

                          setTextColor(gold)

                          gravity = Gravity.CENTER

                          setPadding(
                              dp(16),
                              dp(10),
                              dp(16),
                              dp(10)
                          )

                          background =
                              roundedBackground(
                                  Color.rgb(
                                      42,
                                      36,
                                      18
                                  ),
                                  22
                              )
                      }


                  messages.addView(
                      status,

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {

                          topMargin = dp(8)

                          bottomMargin = dp(22)
                      }
                  )


                  addSectionTitle(
                      "ابدأ بسرعة"
                  )
              }


              private fun addSectionTitle(
                  text: String
              ) {

                  val title =
                      TextView(this).apply {

                          this.text = text

                          textSize = 15f

                          setTextColor(white)

                          gravity = Gravity.RIGHT

                          setPadding(
                              0,
                              dp(6),
                              0,
                              dp(8)
                          )
                      }


                  messages.addView(
                      title,

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
              }


              private fun addCenteredText(
                  text: String,
                  size: Float,
                  color: Int,
                  bottomDp: Int
              ) {

                  val view =
                      TextView(this).apply {

                          this.text = text

                          textSize = size

                          setTextColor(color)

                          gravity = Gravity.CENTER

                          setPadding(
                              dp(8),
                              dp(6),
                              dp(8),
                              dp(bottomDp)
                          )
                      }


                  messages.addView(
                      view,

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
              }


              private fun sendMessage() {

                  val text =
                      input.text.toString().trim()


                  if (text.isEmpty()) {

                      Toast.makeText(
                          this,
                          "اكتب رسالتك أولاً",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }


                  messages.removeAllViews()


                  addMessage(
                      text,
                      true
                  )


                  input.setText("")


                  addMessage(
                      generateLocalResponse(text),
                      false
                  )


                  scrollToBottom()
              }


              private fun addMessage(
                  text: String,
                  user: Boolean
              ) {

                  val card =
                      TextView(this).apply {

                          this.text = text

                          textSize = 15.5f

                          setTextColor(white)

                          gravity = Gravity.RIGHT

                          setLineSpacing(
                              0f,
                              1.15f
                          )

                          setPadding(
                              dp(18),
                              dp(14),
                              dp(18),
                              dp(14)
                          )


                          background =
                              roundedBackground(

                                  if (user) {
                                      Color.rgb(
                                          67,
                                          56,
                                          20
                                      )
                                  } else {
                                      surface
                                  },

                                  20
                              )
                      }


                  messages.addView(
                      card,

                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {

                          topMargin = dp(6)

                          bottomMargin = dp(6)
                      }
                  )
              }


              private fun generateLocalResponse(
                  text: String
              ): String {

                  val value =
                      text.trim().lowercase()


                  return when {

                      value.contains("قصيدة") ||
                          value.contains("شعر") -> {

                          "ممتاز. اذكر الفكرة، القافية، والجو الذي تريده، وسأساعدك في بناء النص الشعري."
                      }


                      value.contains("حلل") ||
                          value.contains("تحليل") -> {

                          "أرسل النص أو الموضوع كاملًا، وسأرتبه إلى: الفكرة، الأدلة، الأنماط، الاحتمالات، والنقاط التي تحتاج تحققًا."
                      }


                      value.contains("كود") ||
                          value.contains("برمج") -> {

                          "أرسل وصف التطبيق أو المشكلة البرمجية، وسأحوّلها إلى بنية ملفات وكود وخطوات بناء قابلة للاختبار."
                      }


                      value.contains("فكرة") ||
                          value.contains("مشروع") -> {

                          "أرسل المجال والهدف، وسأحوّل الفكرة إلى منتج أولي ومتطلبات تقنية وخطة تنفيذ."
                      }


                      else -> {

                          "تم استلام طلبك بنجاح.\n\n" +
                          "هذه النسخة تعمل محليًا داخل الهاتف، " +
                          "والواجهة أصبحت جاهزة لربطها بمحرك ذكاء اصطناعي حقيقي عبر Backend آمن."
                      }
                  }
              }


              private fun scrollToBottom() {

                  chatScroll.post {

                      chatScroll.fullScroll(
                          ScrollView.FOCUS_DOWN
                      )
                  }
              }


              private fun roundedBackground(
                  color: Int,
                  radiusDp: Int
              ): GradientDrawable {

                  return GradientDrawable().apply {

                      setColor(color)

                      cornerRadius =
                          dp(radiusDp).toFloat()
                  }
              }


              private fun dp(
                  value: Int
              ): Int {

                  return (
                      value *
                      resources.displayMetrics.density
                  ).toInt()
              }
          }
          KOTLIN


          # =====================================================
          # TEST
          # =====================================================

          cat > app/src/test/java/com/abuaziza/ai/BasicTest.kt <<'KOTLIN'
          package com.abuaziza.ai

          import org.junit.Assert.assertTrue
          import org.junit.Test

          class BasicTest {

              @Test
              fun buildSanityTest() {
                  assertTrue(true)
              }
          }
          KOTLIN


      # =========================================================
      # VALIDATION
      # =========================================================

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/proguard-rules.pro
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/abuaziza/ai/MainActivity.kt
          test -f app/src/test/java/com/abuaziza/ai/BasicTest.kt

          if grep -E \
            'org\.jetbrains\.kotlin\.android|kotlin-android' \
            build.gradle.kts \
            app/build.gradle.kts \
            gradle.properties \
            2>/dev/null; then

            echo "::error::Legacy Kotlin Android plugin detected."

            exit 1
          fi

          echo "Project validation passed."


      # =========================================================
      # CI SIGNING KEY
      # =========================================================

      - name: Generate CI signing key
        shell: bash
        env:
          CI_STORE_PASSWORD: abuaziza_ci_store
          CI_KEY_PASSWORD: abuaziza_ci_key
          CI_KEY_ALIAS: abuaziza
        run: |
          set -euo pipefail

          rm -f .ci/abuaziza-release.jks

          keytool \
            -genkeypair \
            -v \
            -keystore ".ci/abuaziza-release.jks" \
            -storetype JKS \
            -storepass "${CI_STORE_PASSWORD}" \
            -keypass "${CI_KEY_PASSWORD}" \
            -alias "${CI_KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname \
            "CN=Abuaziza AI, OU=AI, O=Abuaziza, L=Khartoum, ST=Khartoum, C=SD"

          test -s .ci/abuaziza-release.jks


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true


      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-daemon \
            --stacktrace

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties


      # =========================================================
      # VERIFY GRADLE
      # =========================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

          ./gradlew help \
            --no-daemon \
            --stacktrace

          ./gradlew :app:tasks \
            --no-daemon \
            --stacktrace


      # =========================================================
      # TEST
      # =========================================================

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace


      # =========================================================
      # LINT
      # =========================================================

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:lint \
            --no-daemon \
            --stacktrace


      # =========================================================
      # BUILD RELEASE APK
      # =========================================================

      - name: Build signed release APK
        shell: bash
        env:
          CI_STORE_PASSWORD: abuaziza_ci_store
          CI_KEY_PASSWORD: abuaziza_ci_key
          CI_KEY_ALIAS: abuaziza
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          FINAL="release/Abuaziza-AI-v${APP_VERSION_NAME}.apk"

          test -s "$APK"

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          cp "$APK" "$FINAL"

          sha256sum "$FINAL" \
            > release/SHA256SUMS.txt

          test -s "$FINAL"

          test -s release/SHA256SUMS.txt

          ls -lh "$FINAL"

          cat release/SHA256SUMS.txt


      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-v${{ env.APP_VERSION_NAME }}

          path: |
            release/Abuaziza-AI-v${{ env.APP_VERSION_NAME }}.apk
            release/SHA256SUMS.txt

          if-no-files-found: error

          retention-days: 30


      # =========================================================
      # GITHUB RELEASE
      # =========================================================

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          TAG="v${APP_VERSION_NAME}"


          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release upload \
              "$TAG" \
              "release/Abuaziza-AI-v${APP_VERSION_NAME}.apk" \
              "release/SHA256SUMS.txt" \
              --clobber

          else

            gh release create \
              "$TAG" \
              "release/Abuaziza-AI-v${APP_VERSION_NAME}.apk" \
              "release/SHA256SUMS.txt" \
              --title \
              "Abuaziza AI v${APP_VERSION_NAME}" \
              --notes \
              "Production Android APK build."

          fi


      # =========================================================
      # SUMMARY
      # =========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Abuaziza AI Build"
            echo
            echo "- Version: ${APP_VERSION_NAME}"
            echo "- Version Code: ${APP_VERSION_CODE}"
            echo "- AGP: ${AGP_VERSION}"
            echo "- Gradle: ${GRADLE_VERSION}"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Android API: ${ANDROID_PLATFORM}"
            echo "- Build Tools: ${ANDROID_BUILD_TOOLS}"
            echo

            if [ -f "release/Abuaziza-AI-v${APP_VERSION_NAME}.apk" ]; then

              echo "### APK CREATED"
              echo

              echo "\`release/Abuaziza-AI-v${APP_VERSION_NAME}.apk\`"
              echo

              echo "### SHA-256"

              cat release/SHA256SUMS.txt

            else

              echo "### APK NOT CREATED"

            fi

          } >> "$GITHUB_STEP_SUMMARY"
