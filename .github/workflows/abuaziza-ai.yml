name: Abuaziza AI - Clean Production Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  APP_ID: com.abuaziza.ai
  APP_NAME: Abuaziza AI
  VERSION_NAME: 1.0.3
  VERSION_CODE: 4
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  AGP_VERSION: "9.4.0"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build Abuaziza AI APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # IMPORTANT:
      # No Gradle cache here because the Gradle project is generated
      # later in the workflow.
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 4. Clean generated project
      # ============================================================
      - name: Clean old generated project
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf gradle
          rm -rf build
          rm -rf .gradle
          rm -rf release
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/abuaziza/ai
          mkdir -p app/src/test/java/com/abuaziza/ai
          mkdir -p release

      # ============================================================
      # 5. settings.gradle.kts
      # ============================================================
      - name: Generate settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbuazizaAI"
          include(":app")
          EOF

      # ============================================================
      # 6. Root Gradle build
      # AGP 9.4 built-in Kotlin:
      # DO NOT apply org.jetbrains.kotlin.android.
      # ============================================================
      - name: Generate root build.gradle.kts
        run: |
          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
          }
          EOF

      # ============================================================
      # 7. Gradle properties
      # ============================================================
      - name: Generate gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=false

          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.builtInKotlin=true
          EOF

      # ============================================================
      # 8. AndroidManifest
      # ============================================================
      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Abuaziza AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # 9. Styles
      # ============================================================
      - name: Generate styles.xml
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

      # ============================================================
      # 10. app/build.gradle.kts
      #
      # IMPORTANT:
      # No org.jetbrains.kotlin.android plugin.
      # No kotlin { compilerOptions }.
      # ============================================================
      - name: Generate app build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.abuaziza.ai"

              compileSdk = 36

              defaultConfig {
                  applicationId = "com.abuaziza.ai"

                  minSdk = 26
                  targetSdk = 36

                  versionCode = 4
                  versionName = "1.0.3"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  abortOnError = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")

              testImplementation("junit:junit:4.13.2")
          }
          EOF

      # ============================================================
      # 11. MainActivity.kt
      # ============================================================
      - name: Generate MainActivity.kt
        run: |
          cat > app/src/main/java/com/abuaziza/ai/MainActivity.kt <<'EOF'
          package com.abuaziza.ai

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(Color.rgb(18, 18, 18))
                  }

                  val title = TextView(this).apply {
                      text = "أبوعزيزة AI"
                      textSize = 32f
                      setTextColor(Color.rgb(212, 175, 55))
                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "منصة الذكاء الاصطناعي"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }
          }
          EOF

      # ============================================================
      # 12. Unit test
      # ============================================================
      - name: Generate unit test
        run: |
          cat > app/src/test/java/com/abuaziza/ai/BasicTest.kt <<'EOF'
          package com.abuaziza.ai

          import org.junit.Test
          import org.junit.Assert.assertTrue

          class BasicTest {

              @Test
              fun projectBuildTest() {
                  assertTrue(true)
              }
          }
          EOF

      # ============================================================
      # 13. Validate generated project
      # ============================================================
      - name: Validate project files
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/abuaziza/ai/MainActivity.kt

          if grep -R \
            "org.jetbrains.kotlin.android" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.gradle; then

            echo "ERROR: Legacy Kotlin Android plugin detected."
            exit 1
          fi

          if grep -R \
            "kotlin {.*compilerOptions" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.gradle; then

            echo "ERROR: Legacy Kotlin compiler configuration detected."
            exit 1
          fi

          echo "Project validation passed."

      # ============================================================
      # 14. Gradle setup
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      # ============================================================
      # 15. Generate Gradle Wrapper
      # ============================================================
      - name: Generate Gradle Wrapper
        run: |
          set -euo pipefail

          gradle --version

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          chmod +x ./gradlew

          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

      # ============================================================
      # 16. Gradle environment
      # ============================================================
      - name: Verify Gradle environment
        run: |
          set -euo pipefail

          ./gradlew --version
          ./gradlew help --stacktrace

      # ============================================================
      # 17. List Android tasks
      # ============================================================
      - name: Verify Android Gradle Plugin
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --all \
            --stacktrace

      # ============================================================
      # 18. Unit tests
      # ============================================================
      - name: Run unit tests
        run: |
          set -euo pipefail

          ./gradlew \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 19. Lint
      # ============================================================
      - name: Run Android lint
        run: |
          set -euo pipefail

          ./gradlew \
            :app:lint \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 20. Build release APK
      # ============================================================
      - name: Build release APK
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 21. Locate APK
      # ============================================================
      - name: Locate APK
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"

      # ============================================================
      # 22. Copy APK
      # ============================================================
      - name: Prepare release artifact
        run: |
          set -euo pipefail

          cp \
            "app/build/outputs/apk/release/app-release-unsigned.apk" \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          test -f \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          ls -lh release/

      # ============================================================
      # 23. SHA-256
      # ============================================================
      - name: Generate SHA-256
        run: |
          set -euo pipefail

          sha256sum \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
            | tee "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256"

      # ============================================================
      # 24. Upload APK artifact
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-v${{ env.VERSION_NAME }}
          path: |
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk.sha256
          if-no-files-found: error

      # ============================================================
      # 25. Create GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release ${TAG} already exists."

            gh release upload \
              "$TAG" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256" \
              --clobber

          else

            gh release create \
              "$TAG" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256" \
              --title "Abuaziza AI ${VERSION_NAME}" \
              --notes "Automated Android release build."

          fi

      # ============================================================
      # 26. Final summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "       ABUAZIZA AI BUILD SUMMARY"
          echo "=========================================="
          echo "App ID:       ${APP_ID}"
          echo "App Name:     ${APP_NAME}"
          echo "Version:      ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Java:         ${JAVA_VERSION}"
          echo "Gradle:       ${GRADLE_VERSION}"
          echo "AGP:          ${AGP_VERSION}"
          echo "Android API:  ${ANDROID_API}"
          echo "=========================================="

          if [ -f "release/Abuaziza-AI-v${VERSION_NAME}.apk" ]; then
              echo "APK: CREATED"
              ls -lh "release/Abuaziza-AI-v${VERSION_NAME}.apk"
          else
              echo "APK: NOT CREATED"
          fi
