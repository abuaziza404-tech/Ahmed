name: Abuaziza AI - Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: abuaziza-ai-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_ID: com.abuaziza.ai
  APP_NAME: Abuaziza AI
  VERSION_NAME: "1.0.3"
  VERSION_CODE: "4"

  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  AGP_VERSION: "9.4.0"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build and Release Abuaziza AI
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. ANDROID SDK
      #
      # لا تستخدم android-actions/setup-android
      # لأن Runner Ubuntu 24.04 يحتوي SDK مسبقاً.
      #
      # إذا كان مكوّن ناقصاً يتم تثبيته فقط عند الحاجة.
      # ============================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d "${ANDROID_HOME}"

          SDKMANAGER=""

          if [ -x "${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Searching Android SDK..."
            find "${ANDROID_HOME}" \
              -maxdepth 6 \
              -type f \
              -name "sdkmanager" \
              -print || true
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"

          PLATFORM_DIR="${ANDROID_HOME}/platforms/android-${ANDROID_API}"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          if [ ! -d "${PLATFORM_DIR}" ] || [ ! -d "${BUILD_TOOLS_DIR}" ]; then

            echo "Required Android SDK components are missing."

            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

            "${SDKMANAGER}" \
              "platform-tools" \
              "platforms;android-${ANDROID_API}" \
              "build-tools;${BUILD_TOOLS}"

          fi

          test -d "${PLATFORM_DIR}"
          test -d "${BUILD_TOOLS_DIR}"
          test -x "${ANDROID_HOME}/platform-tools/adb"

          echo "Android SDK READY."
          echo "Platform: ${ANDROID_API}"
          echo "Build Tools: ${BUILD_TOOLS}"


      # ============================================================
      # 4. CLEAN EVERYTHING GENERATED BY PREVIOUS BUILDS
      # ============================================================

      - name: Clean generated project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            app \
            gradle \
            build \
            .gradle \
            release \
            .ci

          rm -f \
            settings.gradle \
            settings.gradle.kts \
            build.gradle \
            build.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat

          mkdir -p \
            app/src/main/java/com/abuaziza/ai \
            app/src/main/res/values \
            release \
            .ci


      # ============================================================
      # 5. SETTINGS
      # ============================================================

      - name: Generate settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbuazizaAI"

          include(":app")
          EOF


      # ============================================================
      # 6. ROOT BUILD
      # ============================================================

      - name: Generate root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
          }
          EOF


      # ============================================================
      # 7. GRADLE PROPERTIES
      # ============================================================

      - name: Generate gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=false

          android.useAndroidX=false
          android.nonTransitiveRClass=true

          android.builtInKotlin=true
          EOF


      # ============================================================
      # 8. ANDROID MANIFEST
      # ============================================================

      - name: Generate AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Abuaziza AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 9. THEME
      # ============================================================

      - name: Generate styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #121212
                  </item>

                  <item name="android:navigationBarColor">
                      #121212
                  </item>

                  <item name="android:colorAccent">
                      #D4AF37
                  </item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 10. APP GRADLE
      #
      # لا يوجد:
      # org.jetbrains.kotlin.android
      #
      # ولا يوجد:
      # kotlin { ... }
      #
      # التطبيق هنا Java لتقليل نقاط الفشل أثناء مرحلة البناء.
      # ============================================================

      - name: Generate app build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {

              namespace = "com.abuaziza.ai"

              compileSdk = 36

              defaultConfig {

                  applicationId = "com.abuaziza.ai"

                  minSdk = 26

                  targetSdk = 36

                  versionCode = 4

                  versionName = "1.0.3"
              }

              signingConfigs {

                  create("ciRelease") {

                      storeFile =
                          rootProject.file(".ci/release.jks")

                      storePassword =
                          System.getenv("CI_STORE_PASSWORD")

                      keyAlias =
                          System.getenv("CI_KEY_ALIAS")

                      keyPassword =
                          System.getenv("CI_KEY_PASSWORD")
                  }
              }

              buildTypes {

                  debug {

                      isMinifyEnabled = false
                  }

                  release {

                      isMinifyEnabled = false

                      isShrinkResources = false

                      signingConfig =
                          signingConfigs.getByName("ciRelease")
                  }
              }

              compileOptions {

                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }

              lint {

                  abortOnError = true
              }
          }
          EOF


      # ============================================================
      # 11. MAIN ACTIVITY
      # ============================================================

      - name: Generate MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/abuaziza/ai/MainActivity.java <<'EOF'
          package com.abuaziza.ai;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setGravity(
                          Gravity.CENTER
                  );

                  root.setPadding(
                          40,
                          40,
                          40,
                          40
                  );

                  root.setBackgroundColor(
                          Color.rgb(
                                  18,
                                  18,
                                  18
                          )
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "أبوعزيزة AI"
                  );

                  title.setTextSize(
                          32
                  );

                  title.setTextColor(
                          Color.rgb(
                                  212,
                                  175,
                                  55
                          )
                  );

                  title.setGravity(
                          Gravity.CENTER
                  );

                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "منصة الذكاء الاصطناعي"
                  );

                  subtitle.setTextSize(
                          18
                  );

                  subtitle.setTextColor(
                          Color.WHITE
                  );

                  subtitle.setGravity(
                          Gravity.CENTER
                  );

                  subtitle.setPadding(
                          0,
                          24,
                          0,
                          0
                  );

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  root.addView(
                          subtitle,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  setContentView(root);
              }
          }
          EOF


      # ============================================================
      # 12. SET UP GRADLE
      # ============================================================

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: true


      # ============================================================
      # 13. GENERATE WRAPPER
      # ============================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          chmod +x ./gradlew

          test -f ./gradlew

          test -f \
            ./gradle/wrapper/gradle-wrapper.properties

          echo "Gradle Wrapper READY."


      # ============================================================
      # 14. CREATE RELEASE SIGNING KEY
      #
      # إذا أضفت Secrets:
      #
      # ANDROID_KEYSTORE_BASE64
      # ANDROID_KEYSTORE_PASSWORD
      # ANDROID_KEY_ALIAS
      # ANDROID_KEY_PASSWORD
      #
      # سيستخدمها.
      #
      # وإذا لم توجد، ينشئ مفتاح CI مؤقت حتى لا يتوقف البناء.
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p .ci

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${ANDROID_KEY_ALIAS:-}" ] &&
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then

            echo "${ANDROID_KEYSTORE_BASE64}" |
              base64 --decode \
              > .ci/release.jks

            {
              echo "CI_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "CI_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "CI_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"

            echo "Using configured GitHub release keystore."

          else

            CI_STORE_PASSWORD="$(openssl rand -hex 24)"
            CI_KEY_PASSWORD="$(openssl rand -hex 24)"
            CI_KEY_ALIAS="abuaziza-ci"

            keytool \
              -genkeypair \
              -v \
              -keystore .ci/release.jks \
              -storetype JKS \
              -storepass "${CI_STORE_PASSWORD}" \
              -keypass "${CI_KEY_PASSWORD}" \
              -alias "${CI_KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname \
              "CN=Abuaziza AI, OU=AI, O=Abuaziza, L=Khartoum, ST=Khartoum, C=SD"

            {
              echo "CI_STORE_PASSWORD=${CI_STORE_PASSWORD}"
              echo "CI_KEY_ALIAS=${CI_KEY_ALIAS}"
              echo "CI_KEY_PASSWORD=${CI_KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"

            echo "Generated temporary CI signing key."

          fi

          test -s .ci/release.jks

          echo "Release signing READY."


      # ============================================================
      # 15. BUILD
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          test -f "${APK}"

          test -x "${APKSIGNER}"

          test -x "${AAPT}"

          "${APKSIGNER}" \
            verify \
            --verbose \
            "${APK}"

          "${AAPT}" \
            dump badging \
            "${APK}" |
            grep -q \
              "package: name='${APP_ID}'"

          mkdir -p release

          cp \
            "${APK}" \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          sha256sum \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk" \
            > \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256"

          echo ""
          echo "APK VERIFIED:"
          ls -lh release/


      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abuaziza-AI-v${{ env.VERSION_NAME }}

          path: |
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk
            release/Abuaziza-AI-v${{ env.VERSION_NAME }}.apk.sha256

          if-no-files-found: error


      # ============================================================
      # 18. GITHUB RELEASE
      # ============================================================

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          APK="release/Abuaziza-AI-v${VERSION_NAME}.apk"

          SHA="release/Abuaziza-AI-v${VERSION_NAME}.apk.sha256"

          if gh release view "${TAG}" >/dev/null 2>&1; then

            echo "Release ${TAG} already exists."

            gh release upload \
              "${TAG}" \
              "${APK}" \
              "${SHA}" \
              --clobber

          else

            gh release create \
              "${TAG}" \
              "${APK}" \
              "${SHA}" \
              --title \
              "Abuaziza AI ${VERSION_NAME}" \
              --notes \
              "Automated Android release build."

          fi

          echo "GitHub Release READY: ${TAG}"


      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "         ABUAZIZA AI BUILD SUMMARY"
          echo "=============================================="

          echo "Application : ${APP_NAME}"
          echo "Package     : ${APP_ID}"
          echo "Version     : ${VERSION_NAME}"
          echo "Code        : ${VERSION_CODE}"

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "AGP         : ${AGP_VERSION}"

          echo "Android API : ${ANDROID_API}"
          echo "BuildTools  : ${BUILD_TOOLS}"

          echo "=============================================="

          if [ -f \
            "release/Abuaziza-AI-v${VERSION_NAME}.apk"
          ]; then

            echo "STATUS: APK CREATED"

            ls -lh \
              "release/Abuaziza-AI-v${VERSION_NAME}.apk"

          else

            echo "STATUS: APK NOT CREATED"

          fi

          echo "=============================================="
