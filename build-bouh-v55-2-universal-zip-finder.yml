name: Build BOUH MapScout V55.2 APK - Universal ZIP Finder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**.zip"
      - ".github/workflows/build-bouh-v55-2-universal-zip-finder.yml"

permissions:
  contents: read

jobs:
  build-android-from-any-uploaded-zip:
    name: Build Android APK from uploaded ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate payload ZIP automatically
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for BOUH V55.2 payload ZIP..."
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | sed 's#^./##' | head -200

          PAYLOAD=""

          if [ -f "BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip" ]; then
            PAYLOAD="BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip"
          fi

          if [ -z "$PAYLOAD" ]; then
            FOUND="$(find . -type f -name 'BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip' | head -1 || true)"
            if [ -n "$FOUND" ]; then
              PAYLOAD="$FOUND"
            fi
          fi

          if [ -z "$PAYLOAD" ]; then
            BUNDLE="$(find . -type f -name 'BOUH_V55_2_GITHUB_ACTIONS_NO_MANUAL_UNZIP_BUNDLE.zip' | head -1 || true)"
            if [ -n "$BUNDLE" ]; then
              echo "Found bundle ZIP: $BUNDLE"
              rm -rf bundle_extract
              mkdir -p bundle_extract
              unzip -q "$BUNDLE" -d bundle_extract
              FOUND="$(find bundle_extract -type f -name 'BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip' | head -1 || true)"
              if [ -n "$FOUND" ]; then
                PAYLOAD="$FOUND"
              fi
            fi
          fi

          if [ -z "$PAYLOAD" ]; then
            echo "::error::Could not find BOUH_MapScout_V55_2_ANDROID_PAYLOAD_UPLOAD_ONLY.zip."
            echo "::error::Upload either the payload ZIP itself, or the no-manual-unzip bundle ZIP."
            exit 1
          fi

          echo "Payload found: $PAYLOAD"
          cp "$PAYLOAD" ./payload.zip
          unzip -t payload.zip
          echo "PAYLOAD=payload.zip" >> "$GITHUB_ENV"

      - name: Extract payload inside GitHub Actions
        run: |
          set -e
          rm -rf build_payload
          mkdir -p build_payload
          unzip -q "$PAYLOAD" -d build_payload
          echo "Extracted payload:"
          find build_payload -maxdepth 5 -type f | sort | head -120

      - name: Validate Android payload
        run: |
          set -e
          python3 build_payload/validate_payload.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        run: |
          set -e
          curl -L -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build debug APK
        working-directory: build_payload
        run: |
          set -e
          ../gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_MapScout_V55_2_debug_apk
          path: build_payload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V55_2_build_logs
          path: |
            build_payload/app/build/reports/
            build_payload/app/build/outputs/logs/
          if-no-files-found: ignore
